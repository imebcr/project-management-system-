# Services de développement local uniquement (la production tourne sans Docker, voir deploy/DEPLOY.md).
# Stockage S3 local : SeaweedFS (les images MinIO ne sont plus publiées). Même API S3 que R2 / Supabase.
name: zidny

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zidny
      POSTGRES_USER: zidny
      POSTGRES_PASSWORD: zidny
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zidny -d zidny"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./docker/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  s3data:
