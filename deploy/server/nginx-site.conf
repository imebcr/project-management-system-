# /etc/nginx/sites-available/zidny-projets — remplacer DOMAIN par le nom de domaine.
# Certbot ajoute ensuite le bloc HTTPS (certbot --nginx -d DOMAIN).
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # Livrables (2 Go max) : envoyés directement au stockage par morceaux de 16 Mo ; CDC et photos via l'API.
    client_max_body_size 110m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fichiers (liens signés) : SeaweedFS S3. L'en-tête Host d'origine est conservé (signature).
    location /zidny-files/ {
        proxy_pass http://127.0.0.1:8333;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/          { proxy_pass http://127.0.0.1:8100; proxy_read_timeout 120s; }
    location /s/            { proxy_pass http://127.0.0.1:8100; }
    location /django-admin/ { proxy_pass http://127.0.0.1:8100; }
    location /static/       { proxy_pass http://127.0.0.1:8100; expires 30d; access_log off; }

    location /_next/static/ { proxy_pass http://127.0.0.1:3100; expires 365d; access_log off; }
    location /              { proxy_pass http://127.0.0.1:3100; }
}
