# /etc/nginx/sites-available/zidny  →  ln -s ../sites-available/zidny /etc/nginx/sites-enabled/
# Remplacez projets.example.com par votre domaine. Certbot complète les lignes ssl_certificate.

upstream zidny_api { server 127.0.0.1:8000; keepalive 16; }
upstream zidny_web { server 127.0.0.1:3000; keepalive 16; }

limit_req_zone $binary_remote_addr zone=zidny_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name projets.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name projets.example.com;

    ssl_certificate     /etc/letsencrypt/live/projets.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projets.example.com/privkey.pem;

    # Les livrables vont directement du navigateur au stockage S3 (URL présignée) :
    # seuls le CDC et les photos de retours passent par ici.
    client_max_body_size 60m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Connexion : limite supplémentaire en plus du verrouillage côté Django
    location = /api/auth/login { limit_req zone=zidny_auth burst=5 nodelay; proxy_pass http://zidny_api; }

    location /api/          { proxy_pass http://zidny_api; proxy_read_timeout 120s; }
    location /s/            { proxy_pass http://zidny_api; }
    location /django-admin/ { proxy_pass http://zidny_api; }
    location /static/       { proxy_pass http://zidny_api; expires 30d; access_log off; }

    location /_next/static/ { proxy_pass http://zidny_web; expires 365d; access_log off; }
    location /              { proxy_pass http://zidny_web; }
}
